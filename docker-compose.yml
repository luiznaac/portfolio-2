# Full stack in one command: the combined app image (Ktor/Spring backend + built
# SPA, from ./Dockerfile) plus its MySQL.
#
#   docker compose up --build                         # everything
#   docker compose -f backend/docker-compose.yml up -d mysql   # just the DB
#     (for local `cd backend` + IntelliJ run + `cd frontend && npm run dev`)
#
# The published image (docker.io/luiznaac/portfolio) is the `app` service only —
# in production the database is a separate, externally provisioned container.
# `backend/docker-compose.yml` is the DB-only file for plain backend dev; the
# integrationTest module starts its own Testcontainers MySQL on the same image and
# database. Keep the three MySQL definitions in sync.
#
# The schema is NOT seeded here: backend/persistence/src/main/resources/db/migration/V*.sql is
# applied by Flyway from deploy/entrypoint.sh before the app starts.

services:
  mysql:
    image: mysql:26.10.0
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=portfolio
    ports:
      - "${MYSQL_PORT:-8112}:3306"
    volumes:
      - portfolio-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: luiznaac/portfolio:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - API_PORT=8080
      - WEB_PORT=8081
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
    ports:
      - "${KTOR_PORT:-8110}:8080"   # API      (Ktor)
      - "${WEB_HOST_PORT:-8111}:8081"   # web / UI  (nginx: SPA + /api proxy)

volumes:
  portfolio-mysql-data:
