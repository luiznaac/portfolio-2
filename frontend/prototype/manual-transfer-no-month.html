<!doctype html>
<!--
  PROTOTYPE — throwaway. Ticket: Manual transfers (#247).
  Question: the manual transfer lives on Alocação, which only renders with an open month.
  Is a month-free entry point needed, and which one?
  Three variants, switchable with ?variant=A|B|C (or ← / →):
    A — Ativos detail: a "Transferir" action on the bucket slice of the attribution panel
    B — Alocação month-free: the tree renders without a month, Targets blank, bucket rows live
    C — Alocação no-month: today's empty state, plus a compact "Legado" card with the action
  Read-only: nothing persists.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Protótipo · Transferência sem mês aberto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #0b0f14;
        --surface: #121a21;
        --surface-2: #19232c;
        --surface-3: #212f3a;
        --line: #263440;
        --line-soft: #1c2833;
        --ink: #e5ebf1;
        --ink-dim: #9ba8b4;
        --ink-faint: #667581;
        --principal: #38bdf8;
        --principal-bg: #38bdf81f;
        --yield: #34d399;
        --yield-bg: #34d3991f;
        --tax: #fb7185;
        --tax-bg: #fb71851f;
        --accent: #f59e0b;
        --accent-bg: #f59e0b1f;
        --violet: #a78bfa;
        --violet-bg: #a78bfa1f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: "IBM Plex Mono", monospace; }
      .cond { font-family: "IBM Plex Sans Condensed", sans-serif; }
      .shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
      .sidebar { border-right: 1px solid var(--line); background: var(--surface); padding: 18px 12px; }
      .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 18px; }
      .brand .dot { width: 18px; height: 18px; border-radius: 6px; background: var(--principal); }
      .brand b { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 15px; letter-spacing: .02em; }
      .nav-group { margin-bottom: 16px; }
      .nav-title {
        font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .09em;
        text-transform: uppercase; color: var(--ink-faint); padding: 0 8px 6px;
      }
      .nav-item { padding: 6px 8px; border-radius: 6px; color: var(--ink-dim); font-size: 13px; }
      .nav-item.active { background: var(--surface-2); color: var(--ink); }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--line); padding: 12px 24px; background: var(--surface);
      }
      .crumb { color: var(--ink-faint); font-size: 12.5px; }
      .crumb b { color: var(--ink-dim); font-weight: 500; }
      .pill {
        border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
        font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-dim);
      }
      main { padding: 20px 24px 96px; }
      h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 24px; font-weight: 700; margin: 0 0 16px; }
      .layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
      .card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
      .card-title { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 600; font-size: 13.5px; }
      .card-body { padding: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th {
        text-align: left; padding: 8px 12px; background: var(--surface-2);
        font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .09em;
        text-transform: uppercase; color: var(--ink-faint); font-weight: 500; white-space: nowrap;
      }
      th.r, td.r { text-align: right; }
      td { border-top: 1px solid var(--line-soft); padding: 8px 12px; vertical-align: middle; }
      tr.row-class td { background: var(--surface-2); }
      .indent-1 { padding-left: 22px; }
      .indent-2 { padding-left: 44px; }
      .level { display: inline-flex; align-items: center; gap: 6px; }
      .caret { color: var(--ink-faint); font-size: 10px; width: 9px; display: inline-block; }
      .bucket-name { color: var(--violet); }
      .muted { color: var(--ink-dim); }
      .faint { color: var(--ink-faint); }
      .tag { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; background: var(--surface-3); color: var(--ink-dim); }
      .tag.manual { background: var(--violet-bg); color: var(--violet); }
      .tag.outside { background: var(--tax-bg); color: var(--tax); }
      .btn { font: inherit; font-size: 12.5px; border-radius: 5px; padding: 5px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
      .btn:hover { border-color: var(--ink-faint); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }
      .btn.ghost { background: transparent; }
      .btn.small { font-size: 11.5px; padding: 3px 8px; }
      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
      .kv:last-child { border-bottom: 0; }
      .kv dt { color: var(--ink-faint); }
      .kv dd { margin: 0; font-family: "IBM Plex Mono", monospace; }
      .note { font-size: 11.5px; color: var(--ink-faint); margin: 8px 0 0; }
      .banner { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; background: var(--surface); font-size: 12.5px; color: var(--ink-dim); }
      .banner b { color: var(--ink); }
      .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--ink-dim); font-size: 13px; }
      .slice-row { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
      .slice-row:last-of-type { border-bottom: 0; }
      .swatch { width: 8px; height: 8px; border-radius: 2px; }
      .slice-name { font-size: 13px; }
      .slice-qty { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-dim); }
      .meter { display: flex; height: 10px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0 4px; }
      .meter div { height: 100%; }
      .overlay { position: fixed; inset: 0; background: #05080bcc; display: none; align-items: center; justify-content: center; z-index: 40; }
      .overlay.open { display: flex; }
      .modal { width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 64px #000a; }
      .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
      .modal-head b { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 15px; }
      .modal-body { padding: 16px; display: grid; gap: 12px; }
      .modal-foot { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 8px; }
      label.field { display: grid; gap: 5px; font-size: 12px; color: var(--ink-dim); }
      input, select { font: inherit; font-family: "IBM Plex Mono", monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; color: var(--ink); padding: 7px 9px; width: 100%; }
      .hint { font-size: 11.5px; color: var(--ink-faint); }
      .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line); border-radius: 7px; padding: 8px 14px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
      .toast.show { opacity: 1; }
      .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 80; background: #f2f6fa; color: #10161d; border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 30px #000c; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
      .switcher button { font: inherit; border: 0; background: #dbe4ec; color: #10161d; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1; }
      .switcher .label { min-width: 230px; text-align: center; font-weight: 600; }
      .switcher .hint { font-weight: 400; opacity: .55; font-size: 10.5px; }
      .variant-note { margin: 0 0 14px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--ink-dim); background: var(--surface); }
      .variant-note b { color: var(--ink); }
      .asset-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
      .asset-head .ticker { font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600; }
      .asset-head .name { color: var(--ink-dim); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="dot"></span><b>Carteira Ideal</b></div>
        <div class="nav-group">
          <div class="nav-title">Ritual</div>
          <div class="nav-item">Cockpit</div>
          <div class="nav-item">Capital e alvos</div>
          <div class="nav-item">Ordens</div>
        </div>
        <div class="nav-group">
          <div class="nav-title">Carteira</div>
          <div class="nav-item" id="nav-allocation">Alocação</div>
          <div class="nav-item">Estratégias</div>
          <div class="nav-item" id="nav-assets">Ativos</div>
        </div>
        <div class="nav-group">
          <div class="nav-title">Resultados</div>
          <div class="nav-item">Proventos</div>
          <div class="nav-item">Impostos</div>
        </div>
      </aside>

      <div>
        <header class="topbar">
          <div class="crumb" id="crumb">Carteira <span class="faint">/</span> <b>Alocação</b></div>
          <div class="pill">Sem mês aberto</div>
        </header>
        <main>
          <p class="variant-note" id="variant-note"></p>
          <div id="page"></div>
        </main>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <b id="modal-title">Transferir do legado</b>
          <button class="btn ghost small" id="modal-close">Fechar</button>
        </div>
        <div class="modal-body">
          <label class="field">Ativo <input value="PETR4" readonly /></label>
          <label class="field">Estratégia de destino
            <select id="modal-target">
              <option>Carteira XP · edição ativa, PETR4 8%</option>
              <option>Dividendos · edição ativa, PETR4 5%</option>
            </select>
          </label>
          <label class="field">Quantidade <input type="number" value="250" min="1" max="400" /></label>
          <p class="hint">Sem mês aberto não há alvo: a atribuição fica inerte até um mês nomear o ativo.</p>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="modal-cancel">Cancelar</button>
          <button class="btn primary" id="modal-apply">Transferir 250 cotas</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="switcher">
      <button id="prev" aria-label="Variante anterior">←</button>
      <div class="label"><span id="switcher-label">A — no ativo</span> <span class="hint">?variant=A</span></div>
      <button id="next" aria-label="Próxima variante">→</button>
    </div>

    <script>
      const VARIANTS = [
        {
          key: "A",
          name: "A — no ativo",
          page: "asset",
          note: "<b>A — no ativo.</b> O detalhe do ativo já edita a atribuição e não precisa de mês. A cota do legado ganha <i>Transferir</i>. A lista de destino usa os pesos da edição ativa, porque não há alvo do mês.",
        },
        {
          key: "B",
          name: "B — Alocação sem mês",
          page: "allocation-live",
          note: "<b>B — Alocação sem mês.</b> A tela renderiza sem mês: alvo e ideal ficam em branco, as linhas do legado e de fora da estratégia mostram a custódia, e a ação vive na cota do legado.",
        },
        {
          key: "C",
          name: "C — cartão Legado",
          page: "allocation-card",
          note: "<b>C — cartão Legado.</b> A Alocação mantém o estado vazio de hoje; acima dele, um cartão <i>Legado</i> lista as cotas e oferece <i>Transferir</i>.",
        },
      ];

      function current() {
        const value = new URLSearchParams(location.search).get("variant") || "A";
        return VARIANTS.some((v) => v.key === value) ? value : "A";
      }

      function go(delta) {
        const index = VARIANTS.findIndex((v) => v.key === current());
        const next = VARIANTS[(index + delta + VARIANTS.length) % VARIANTS.length];
        const url = new URL(location.href);
        url.searchParams.set("variant", next.key);
        history.replaceState(null, "", url);
        render();
      }

      const transferButton = (label = "Transferir") =>
        `<button class="btn small" data-open-transfer="1">${label}</button>`;

      function assetPage() {
        return `
          <div class="asset-head"><span class="ticker">PETR4</span><span class="name">Petrobras PN · 400 cotas · R$ 38.000</span></div>
          <div class="layout" style="margin-top:16px">
            <div class="card">
              <div class="card-title">Atribuição</div>
              <div class="card-body">
                <div class="slice-row">
                  <span class="swatch" style="background:var(--violet)"></span>
                  <span class="slice-name">Legado Ações <span class="tag manual">manual</span></span>
                  <span class="slice-qty">400 cotas · 100%</span>
                  ${transferButton()}
                </div>
                <div class="slice-row">
                  <span class="swatch" style="background:var(--principal)"></span>
                  <span class="slice-name">Carteira XP</span>
                  <span class="slice-qty">0 cotas · 0%</span>
                  <span></span>
                </div>
                <div class="slice-row">
                  <span class="swatch" style="background:var(--ink-faint)"></span>
                  <span class="slice-name muted">Não atribuído</span>
                  <span class="slice-qty">0 cotas</span>
                  <span></span>
                </div>
                <div class="meter"><div style="width:100%;background:var(--violet)"></div></div>
                <p class="note">Custódia 400 cotas · atribuídas 400 · sem sobra.</p>
                <div style="display:flex;gap:8px;margin-top:12px">
                  <select style="max-width:220px"><option>Adicionar estratégia…</option></select>
                  <input style="max-width:110px" type="number" placeholder="cotas" />
                  <button class="btn">Adicionar</button>
                </div>
              </div>
            </div>
            <div class="card">
              <div class="card-title">Posição</div>
              <div class="card-body">
                <dl style="margin:0">
                  <div class="kv"><dt>Custódia</dt><dd>400</dd></div>
                  <div class="kv"><dt>Preço médio</dt><dd>R$ 31,20</dd></div>
                  <div class="kv"><dt>Preço atual</dt><dd>R$ 95,00</dd></div>
                  <div class="kv"><dt>Valor</dt><dd>R$ 38.000</dd></div>
                </dl>
              </div>
            </div>
          </div>`;
      }

      function allocationTree({ live }) {
        const dash = (value) => (live ? value : "—");
        return `
          <div class="card">
            <table>
              <thead><tr>
                <th>Nível</th><th class="r">Alvo</th><th class="r">Ideal</th><th class="r">Atual</th><th></th>
              </tr></thead>
              <tbody>
                <tr><td><span class="level"><span class="caret"></span><span class="cond">Carteira</span></span></td>
                  <td class="r muted">—</td><td class="r mono">${dash("R$ 400.000")}</td><td class="r mono">R$ 396.500</td><td></td></tr>
                <tr class="row-class"><td><span class="level"><span class="caret">▾</span><span class="cond bucket-name">Ações</span></span></td>
                  <td class="r muted">${dash("45%")}</td><td class="r mono">${dash("R$ 180.000")}</td><td class="r mono">R$ 210.000</td><td></td></tr>
                <tr><td class="indent-1"><span class="level"><span class="caret">▾</span><span class="cond bucket-name">Legado Ações</span> <span class="tag manual">manual</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 96.000</td><td></td></tr>
                <tr><td class="indent-2"><span class="level"><span class="caret"></span><span class="mono">PETR4</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 38.000</td><td class="r">${transferButton()}</td></tr>
                <tr><td class="indent-2"><span class="level"><span class="caret"></span><span class="mono">VALE3</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 34.000</td><td class="r">${transferButton()}</td></tr>
                <tr><td class="indent-2"><span class="level"><span class="caret"></span><span class="mono">ITUB4</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 24.000</td><td class="r">${transferButton()}</td></tr>
                <tr><td class="indent-1"><span class="level"><span class="caret">▾</span><span class="cond bucket-name">Fora da estratégia</span> <span class="tag outside">fora</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 24.000</td><td></td></tr>
                <tr><td class="indent-2"><span class="level"><span class="caret"></span><span class="mono">BBAS3</span></span></td>
                  <td class="r muted">—</td><td class="r muted">—</td><td class="r mono">R$ 24.000</td><td></td></tr>
              </tbody>
            </table>
          </div>`;
      }

      function allocationLivePage() {
        return `
          <h1>Alocação</h1>
          <div class="banner"><b>Nenhum mês aberto.</b> Os alvos e ideais do mês não existem, então a árvore mostra só a custódia. <span style="color:var(--principal)">Abrir um mês</span> para planejar.</div>
          <div class="layout">
            <div>${allocationTree({ live: false })}</div>
            <div class="card">
              <div class="card-title">Capital do mês</div>
              <div class="card-body">
                <p class="note" style="margin:0">Sem mês aberto não há capital, piso nem drift.</p>
              </div>
            </div>
          </div>`;
      }

      function allocationCardPage() {
        return `
          <h1>Alocação</h1>
          <div class="card" style="margin-bottom:16px">
            <div class="card-title">Legado</div>
            <div class="card-body">
              <p class="note" style="margin:0 0 8px">Cotas guardadas no legado, fora de qualquer alvo. Transferir move a atribuição, nunca a custódia.</p>
              <div class="slice-row">
                <span class="swatch" style="background:var(--violet)"></span>
                <span class="slice-name mono">PETR4</span>
                <span class="slice-qty">400 cotas · R$ 38.000</span>
                ${transferButton()}
              </div>
              <div class="slice-row">
                <span class="swatch" style="background:var(--violet)"></span>
                <span class="slice-name mono">VALE3</span>
                <span class="slice-qty">500 cotas · R$ 34.000</span>
                ${transferButton()}
              </div>
              <div class="slice-row">
                <span class="swatch" style="background:var(--violet)"></span>
                <span class="slice-name mono">ITUB4</span>
                <span class="slice-qty">300 cotas · R$ 24.000</span>
                ${transferButton()}
              </div>
            </div>
          </div>
          <div class="empty">
            Nenhum mês aberto. <span style="color:var(--principal)">Abra um mês</span> para ver a alocação e os alvos.
          </div>`;
      }

      const overlay = document.getElementById("overlay");
      document.getElementById("modal-close").addEventListener("click", () => overlay.classList.remove("open"));
      document.getElementById("modal-cancel").addEventListener("click", () => overlay.classList.remove("open"));
      document.getElementById("modal-apply").addEventListener("click", () => {
        overlay.classList.remove("open");
        toast("250 cotas transferidas de Legado Ações para Carteira XP");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") overlay.classList.remove("open");
      });

      let toastTimer;
      function toast(message) {
        const el = document.getElementById("toast");
        el.textContent = message;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function render() {
        const variant = current();
        const meta = VARIANTS.find((v) => v.key === variant);
        document.getElementById("switcher-label").textContent = meta.name;
        document.querySelector(".switcher .hint").textContent = "?variant=" + variant;
        document.getElementById("variant-note").innerHTML = meta.note;
        document.getElementById("nav-allocation").classList.toggle("active", meta.page !== "asset");
        document.getElementById("nav-assets").classList.toggle("active", meta.page === "asset");
        document.getElementById("crumb").innerHTML =
          meta.page === "asset"
            ? 'Carteira <span class="faint">/</span> <b>Ativos</b> <span class="faint">/</span> <b>PETR4</b>'
            : 'Carteira <span class="faint">/</span> <b>Alocação</b>';

        const page = document.getElementById("page");
        if (meta.page === "asset") page.innerHTML = assetPage();
        else if (meta.page === "allocation-live") page.innerHTML = allocationLivePage();
        else page.innerHTML = allocationCardPage();

        page.querySelectorAll("[data-open-transfer]").forEach((b) =>
          b.addEventListener("click", () => overlay.classList.add("open")),
        );
      }

      document.getElementById("prev").addEventListener("click", () => go(-1));
      document.getElementById("next").addEventListener("click", () => go(1));
      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "ArrowRight") go(1);
      });
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
