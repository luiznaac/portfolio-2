<!DOCTYPE html>
<!--
  THROWAWAY PROTOTYPE — wayfinder ticket #354, map #347.
  Question: how should report and extract uploads work when uploads are both
  contextual and global? Entry points, staging/diff review, warnings and
  row-level errors, and the way back from an inbox item to the object it changes.
  Three treatments, switchable in the bottom bar and in the URL (?v=a|b|c).
  Data: ./fixture.js (ticket #356). No build step, no persistence.
  Visual direction is NOT decided here — that is ticket #355.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protótipo de importações — Carteira Ideal (ticket #354)</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --panel-2: #f8fafb;
    --ink: #14181d; --ink-2: #5a6572; --ink-3: #8b95a1;
    --line: #dfe4e9; --line-2: #edf0f3;
    --accent: #1d4ed8; --accent-bg: #e8eefc;
    --gain: #15803d; --loss: #b91c1c; --warn: #b45309; --warn-bg: #fdf3e3;
    --action: #b91c1c; --action-bg: #fdeaea; --surplus: #a16207;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --bar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: calc(var(--bar) + 26px); }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  button, select, input { font: inherit; color: inherit; }
  .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { text-align: right; white-space: nowrap; }
  .dim { color: var(--ink-2); } .faint { color: var(--ink-3); }
  .gain { color: var(--gain); } .loss { color: var(--loss); }
  .def { color: #1d4ed8; } .sur { color: var(--surplus); }
  .sp { flex: 1; }

  .proto-banner { background: #101826; color: #c7d2e3; font-size: 11px; padding: 5px 16px; display: flex; gap: 14px; align-items: center; }
  .proto-banner b { color: #fff; font-weight: 600; }
  .proto-banner .tag { border: 1px solid #33415a; padding: 0 6px; border-radius: 3px; color: #93a4bd; }

  .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 27px; height: calc(100vh - 27px - var(--bar)); }
  .side .brand { padding: 16px 16px 10px; display: flex; align-items: baseline; gap: 7px; }
  .side .brand b { font-size: 14px; letter-spacing: -.01em; }
  .side .brand span { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
  .side nav { padding: 6px 8px; overflow: auto; }
  .side .group-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); padding: 13px 8px 4px; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 5px; background: none; cursor: pointer; color: var(--ink-2); text-align: left; font-size: 12.5px; }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 15px; height: 15px; flex: none; opacity: .85; }
  .nav-item .cnt { margin-left: auto; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; font: 600 10px/17px var(--mono); text-align: center; background: var(--line); color: var(--ink-2); }
  .nav-item .cnt.action { background: var(--action); color: #fff; }
  .side .foot { margin-top: auto; border-top: 1px solid var(--line-2); padding: 11px 16px; font-size: 11px; color: var(--ink-3); display: grid; gap: 3px; }
  .side .foot b { color: var(--ink-2); font-weight: 600; }

  .main { min-width: 0; }
  .topbar { min-height: 52px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 0 22px; position: sticky; top: 27px; z-index: 20; }
  .crumb { color: var(--ink-2); font-size: 12px; } .crumb b { color: var(--ink); }
  .month-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 16px; padding: 4px 11px; font-size: 11.5px; color: var(--ink-2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gain); display: inline-block; }
  .topbar .age { font-size: 11px; color: var(--ink-3); }
  .kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 10px/14px var(--mono); color: var(--ink-3); background: var(--panel); }
  .content { padding: 20px 22px 40px; max-width: 1400px; }

  .page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
  .page-head h1 { font-size: 21px; line-height: 1.15; letter-spacing: -.025em; margin: 0 0 3px; font-weight: 650; }
  .page-head p { margin: 0; color: var(--ink-2); font-size: 12px; }
  .page-head .actions { display: flex; gap: 8px; align-items: center; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 2px 0 16px; }
  .tabs button { border: 0; background: none; cursor: pointer; padding: 7px 11px; color: var(--ink-2); font-size: 12.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs button .b { margin-left: 5px; font: 600 9.5px/15px var(--mono); background: var(--action); color: #fff; border-radius: 8px; padding: 0 4px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
  .panel > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .panel > header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin: 0; color: var(--ink-2); font-weight: 650; }
  .panel > header .hint { font-size: 11px; color: var(--ink-3); }
  .panel .body { padding: 13px 14px; }
  .panel .body.flush { padding: 0; }
  .grid { display: grid; gap: 14px; } .grid > * { min-width: 0; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
  .stack { display: grid; gap: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
  .kpi .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
  .kpi .v { font: 600 19px/1.25 var(--mono); margin-top: 3px; letter-spacing: -.03em; }
  .kpi .s { font-size: 11px; color: var(--ink-2); margin-top: 1px; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.t th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--line-2); background: var(--panel-2); white-space: nowrap; }
  table.t td { padding: 7px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t th.r, table.t td.r { text-align: right; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: var(--panel-2); }
  table.t tr.muted td { color: var(--ink-3); background: #fbfcfd; }
  table.t tr.muted .ticker { color: var(--ink-3); text-decoration: line-through; }
  table.t tr.changed td { background: #f8fbff; }
  table.t tr.changed td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .ticker { font: 600 12px/1 var(--mono); letter-spacing: -.01em; }

  .chip { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 9.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-2); background: var(--panel-2); line-height: 15px; white-space: nowrap; }
  .chip.blue { color: var(--accent); background: var(--accent-bg); border-color: #cfdcfb; }
  .chip.amber { color: var(--warn); background: var(--warn-bg); border-color: #f3e0bd; }
  .chip.red { color: var(--action); background: var(--action-bg); border-color: #f5cfcf; }
  .chip.green { color: var(--gain); background: #e9f6ee; border-color: #cce9d7; }
  .chip.grey { color: var(--ink-3); } .chip.plain { background: none; }

  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .btn:hover { border-color: #c7d0d9; background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1743bb; }
  .btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
  .btn.danger { color: var(--action); border-color: #f0cccc; }
  .btn.sm { padding: 3px 7px; font-size: 11px; }

  .callout { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--ink-3); background: var(--panel-2); }
  .callout b { color: var(--ink-2); font-weight: 600; }
  .banner-tests { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; font-size: 11.5px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 5px; padding: 7px 11px; }
  .banner-tests b { color: var(--ink); }

  .source-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .source-card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 11px 12px; display: grid; gap: 3px; cursor: pointer; }
  .source-card:hover { border-color: #c7d0d9; }
  .source-card .lbl { font-size: 12px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .source-card .meta { font-size: 11px; color: var(--ink-3); }
  .source-card .st { font-size: 11px; color: var(--ink-2); }

  .queue { display: grid; }
  .qitem { display: grid; grid-template-columns: minmax(190px, 1.1fr) minmax(160px, 1fr) auto 190px; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line-2); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; cursor: pointer; }
  .qitem:hover { background: var(--panel-2); }
  .qitem:last-child { border-bottom: 0; }
  .qitem .src { font-size: 11px; color: var(--ink-3); }
  .qitem .file { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qitem .what { font-size: 11px; color: var(--ink-2); }
  .qitem .dest { font-size: 11px; }
  .qitem .right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

  .dest-rows { display: grid; }
  .dest-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12px; }
  .dest-row:last-child { border-bottom: 0; }
  .dest-row .d { color: var(--ink-2); }

  .mapping { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; font-size: 11.5px; }
  .map-cell { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--line-2); padding-bottom: 5px; }
  .map-cell .from { color: var(--ink-3); font: 10.5px var(--mono); }
  .map-cell .to { font-weight: 600; }
  .map-cell .ok { color: var(--gain); font-size: 10px; margin-left: auto; }

  .applybar { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 7px 7px; flex-wrap: wrap; }
  .applybar .sum { font-size: 12px; }
  .okbanner { display: flex; align-items: center; gap: 10px; background: #eef8f1; border: 1px solid #cce9d7; color: #14532d; border-radius: 6px; padding: 9px 12px; font-size: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .okbanner a { color: #14532d; text-decoration: underline; }
  .warnbanner { display: flex; align-items: flex-start; gap: 10px; background: var(--warn-bg); border: 1px solid #f3e0bd; color: #7c4a03; border-radius: 6px; padding: 9px 12px; font-size: 11.5px; margin-bottom: 10px; }
  .infobanner { display: flex; align-items: center; gap: 10px; background: var(--accent-bg); border: 1px solid #cfdcfb; color: #1e3a8a; border-radius: 6px; padding: 9px 12px; font-size: 11.5px; margin-bottom: 12px; flex-wrap: wrap; }
  .infobanner a { color: #1e3a8a; text-decoration: underline; }

  .row-error td { background: #fff6f6; }
  .error-edit { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .error-edit input { border: 1px solid #e7b7b7; border-radius: 4px; padding: 2px 6px; width: 92px; font: 11.5px var(--mono); background: #fff; }
  .error-edit .hint { font-size: 10.5px; color: var(--action); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .diff-legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--ink-3); flex-wrap: wrap; }
  .legend { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .modal-back { position: fixed; inset: 0; background: rgba(15, 23, 34, .45); z-index: 140; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 40px; }
  .modal { background: var(--panel); border-radius: 9px; width: 560px; max-width: 100%; box-shadow: 0 24px 70px rgba(9, 15, 25, .35); overflow: hidden; }
  .modal .mhead { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .modal .mhead h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .modal .mbody { padding: 14px 16px; display: grid; gap: 12px; }
  .modal .mfoot { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .field { display: grid; gap: 4px; }
  .field .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 650; }
  .field select { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--panel); font-size: 12px; }
  .drop { border: 1.5px dashed #c7d0d9; border-radius: 7px; background: var(--panel-2); padding: 20px 14px; text-align: center; }
  .drop b { display: block; font-size: 12.5px; }
  .drop span { font-size: 11px; color: var(--ink-3); }
  .sample { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 11.5px; background: var(--panel); }
  .segmented { display: inline-flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .segmented button { border: 0; background: none; cursor: pointer; padding: 4px 11px; border-radius: 4px; color: var(--ink-2); font-size: 12px; }
  .segmented button.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(15, 23, 34, .10); }

  .wiz { min-height: calc(100vh - var(--bar) - 26px); display: grid; grid-template-rows: auto auto 1fr auto; background: var(--bg); }
  .wiz-top { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 22px; min-height: 54px; position: sticky; top: 27px; z-index: 30; flex-wrap: wrap; }
  .wiz-brand { font-weight: 650; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; }
  .wiz-brand span { color: var(--ink-3); font-weight: 400; }
  .wiz-dest { font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 3px 10px; white-space: nowrap; }
  .wiz-close { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 16px; padding: 2px 6px; }
  .wiz-close:hover { color: var(--ink); }
  .steps-rail { max-width: 1080px; margin: 0 auto; padding: 16px 22px 0; width: 100%; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
  .step .n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 600 10px/1 var(--mono); background: var(--panel); }
  .step.active { color: var(--ink); font-weight: 600; }
  .step.active .n { background: var(--ink); color: #fff; border-color: var(--ink); }
  .step.done { color: var(--ink-2); }
  .step.done .n { background: #e9f6ee; color: var(--gain); border-color: #cce9d7; }
  .step-rule { flex: 1; height: 1px; background: var(--line); max-width: 60px; }
  .wiz-body { max-width: 1080px; width: 100%; margin: 0 auto; padding: 18px 22px 30px; }
  .wiz-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .wiz-panel > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .wiz-panel > header h2 { margin: 0; font-size: 13px; }
  .wiz-panel .pad { padding: 14px 16px; }
  .wiz-foot { position: sticky; bottom: var(--bar); background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 10px 22px; z-index: 25; flex-wrap: wrap; }
  .wiz-foot .note { font-size: 11px; color: var(--ink-3); }

  .attn { display: grid; }
  .attn-item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--line-2); align-items: start; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; width: 100%; }
  .attn-item:hover { background: var(--panel-2); }
  .attn-item:last-child { border-bottom: 0; }
  .attn-item .mark { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; background: var(--ink-3); }
  .attn-item .mark.action { background: var(--action); }
  .attn-item .mark.watch { background: var(--surplus); }
  .attn-item .ttl { display: block; font-size: 12px; font-weight: 550; }
  .attn-item .det { display: block; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .attn-item .go { font-size: 11px; color: var(--accent); margin-top: 1px; white-space: nowrap; }

  .pbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 150; background: #0f1722; color: #dbe3ee; border-top: 1px solid #263242; display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: var(--bar); box-shadow: 0 -6px 24px rgba(9, 15, 25, .18); flex-wrap: wrap; }
  .pbar .title { font-size: 11px; color: #8fa0b8; line-height: 1.25; max-width: 150px; }
  .pbar .title b { color: #fff; display: block; font-size: 11.5px; }
  .pbar .sep { width: 1px; align-self: stretch; background: #263242; margin: 2px 4px; }
  .pbar button.v { border: 1px solid #33415a; background: #172437; color: #c8d4e5; border-radius: 5px; padding: 5px 9px; cursor: pointer; font-size: 11.5px; text-align: left; line-height: 1.2; }
  .pbar button.v small { display: block; color: #8092aa; font-size: 9.5px; margin-top: 1px; }
  .pbar button.v.active { background: #e8eefc; border-color: #e8eefc; color: #14306b; }
  .pbar button.v.active small { color: #3d5a8f; }
  .pbar .scen { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .pbar .scen .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: #8092aa; margin-right: 3px; white-space: nowrap; }
  .pbar button.pv { border: 1px solid #33415a; background: #172437; color: #c8d4e5; border-radius: 4px; padding: 4px 7px; cursor: pointer; font-size: 11px; white-space: nowrap; }
  .pbar button.pv:hover { border-color: #4b5d7a; }
  .pbar .note { font-size: 10.5px; color: #8092aa; max-width: 240px; text-align: right; }
  .pbar .note b { color: #c8d4e5; font-weight: 600; }
  .pbar .ghost { border: 1px solid #33415a; background: none; color: #c8d4e5; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 11px; }

  .drawer { position: fixed; right: 12px; bottom: calc(var(--bar) + 10px); z-index: 160; width: 470px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(15, 23, 34, .22); padding: 14px 16px; font-size: 12px; display: none; }
  .drawer.open { display: block; }
  .drawer h3 { margin: 0 0 6px; font-size: 13px; }
  .drawer p { margin: 0 0 8px; color: var(--ink-2); }
  .drawer ul { margin: 0 0 8px; padding-left: 16px; color: var(--ink-2); }
  .drawer li { margin-bottom: 3px; }
  .drawer .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 650; margin-bottom: 3px; }

      ${destinationsPanel(kind)}
      <div style="margin-top:14px">${kind === "xp" ? provenance("XP_Relatorio_Novembro_2026.csv", "c4e8a2d6f0b4c8e2a6d0f4b8c2e6a0d4", "A primeira tentativa em PDF falhou.") : provenance(IMPORT[id === "102" ? 102 : 101].file_name, IMPORT[id === "102" ? 102 : 101].file_hash)}</div>`;

      ${tabs(IMPORT_TABS, "inbox")}
      <div class="stack">

      ${destinationsPanel(isCustody ? "custody" : "b3")}

      ${isCustody ? custodyDiffTable() : `${mappingPanel("b3")}${b3RowsTable()}`}

/* ============================ wizard (treatment C) ============================ */

const WIZ_LABELS = {
  b3: ["Arquivo", "Destino e mapeamento", "Linhas", "Aplicar"],
  custody: ["Arquivo", "Destino e mapeamento", "Divergências", "Aplicar"],
  xp: ["Arquivo", "Destino e mapeamento", "Diff da edição", "Promover"],
};

function wizardApplied(kind) {
  return kind === "xp" ? rt.edition === "promoted" : kind === "custody" ? !!rt.custody : !!rt.b3;
}

function wizardHTML(kind, stepInput) {
  const labels = WIZ_LABELS[kind] ? WIZ_LABELS[kind] : WIZ_LABELS.b3;
  const step = Math.max(1, Math.min(4, Number(stepInput) || 1));
  const dest = kind === "xp" ? "Dividendos BR · nov/2026" : kind === "custody" ? "Ativos · Posições · 31/10" : "Ativos · Posições · extrato B3";
  const meta = kind === "xp" ? "XP · layout 2026-07" : kind === "custody" ? "B3 · posição em custódia" : "B3 · movimentação";
  const stepBody = () => {
    if (step === 1) {
      return `<section class="wiz-panel"><header><h2>Arquivo</h2><span class="sp"></span><span class="hint">aberto de: ${kind === "xp" ? "Estratégias · Dividendos BR" : "Ativos · Posições"}</span></header>
        <div class="pad" style="display:grid;gap:12px">
          <div class="segmented">
            <button class="${kind === "xp" ? "active" : ""}" data-wiz-kind="xp">Relatório XP</button>
            <button class="${kind === "b3" ? "active" : ""}" data-wiz-kind="b3">Extrato B3</button>
            <button class="${kind === "custody" ? "active" : ""}" data-wiz-kind="custody">Custódia B3</button>
          </div>
          <div class="drop"><b>Arraste o arquivo aqui</b><span>o contexto já escolheu o parser: ${meta}</span></div>
          <div class="sample"><span class="mono">${kind === "xp" ? "XP_Relatorio_Novembro_2026.csv" : kind === "custody" ? "posicao-2026-10-31.xlsx" : "movimentacao-2026-10-31.xlsx"}</span><span class="sp"></span><span class="chip green plain">arquivo escolhido</span></div>
          <div class="callout"><b>Contexto sem cerimônia.</b> O destino ${dest} veio de onde o assistente foi aberto; trocar é explícito, não um passo a mais.</div>
        </div>
      </section>`;
    }
    if (step === 2) {
      return `<div class="stack">
        <section class="wiz-panel"><header><h2>Destino</h2><span class="sp"></span><span class="chip blue plain">pré-preenchido</span></header>
          <div class="pad"><div class="dest-rows">
            <div class="dest-row"><span class="dim">Destino</span><span class="sp"></span><b>${dest}</b><a data-act="noop">trocar</a></div>
            <div class="dest-row"><span class="dim">Parser</span><span class="sp"></span><b>${meta}</b><span class="chip green plain">reconhecido</span></div>
            <div class="dest-row"><span class="dim">Aplicação</span><span class="sp"></span><b>${kind === "xp" ? "promover a edição a ativa" : kind === "custody" ? "sobrescrever o snapshot" : "aplicar as linhas válidas"}</b></div>
          </div></div>
        </section>
        ${kind === "custody"
          ? `<div class="callout">A custódia não passa por mapeamento de colunas de negócio: o parser lê ticker e quantidade, e a revisão é a divergência contra o livro.</div>`
          : mappingPanel(kind)}
      </div>`;
    }
    if (step === 3) {
      reviewOnly = true;
      const body = kind === "xp" ? editionDiffTable() : kind === "custody" ? custodyDiffTable() : b3RowsTable();
      reviewOnly = false;
      return `<div class="stack">
        ${kind === "xp" ? `<div class="callout">O assistente compara o relatório com a edição ativa antes de promover; a promoção acontece na última etapa.</div>` : ""}
        ${body}
      </div>`;
    }
    const applied = wizardApplied(kind);
    const counts = kind === "xp"
      ? ["2 pesos alterados", "5 preços-alvo", "1 alerta: VALE3 não operar"]
      : kind === "custody"
      ? ["11 posições", "1 divergência", "1 lacuna ao aplicar"]
      : ["3 linhas válidas", "1 rejeitada", "1 lote de reenvio"];
    return `<div class="stack">
      <section class="wiz-panel"><header><h2>${applied ? "Concluído" : "Resumo"}</h2><span class="sp"></span><span class="chip ${applied ? "green" : "amber"} plain">${applied ? "aplicado" : "nada aplicado ainda"}</span></header>
        <div class="pad" style="display:grid;gap:12px">
          <div class="dest-rows">
            <div class="dest-row"><span class="dim">Destino</span><span class="sp"></span><b>${dest}</b></div>
            ${counts.map((c) => `<div class="dest-row"><span class="dim">${c}</span><span class="sp"></span></div>`).join("")}
          </div>
          ${applied
            ? `<div class="okbanner" style="margin:0"><b>${kind === "xp" ? "Edição 104 promovida." : kind === "custody" ? "Snapshot aplicado." : "3 linhas aplicadas."}</b><span>${kind === "b3" ? "A linha rejeitada ficou no lote de reenvio." : "O objeto de destino já reflete a mudança."}</span><span class="sp"></span><a data-act="wiz-finish">Concluir →</a></div>`
            : `<div class="applybar" style="border:1px solid var(--line);border-radius:7px">
                <div class="sum"><b>${kind === "xp" ? "Promover substitui a edição 103." : kind === "custody" ? "A divergência vira lacuna." : "A rejeitada fica fora do lote."}</b><span class="dim"> a sessão pode ficar aqui até a decisão.</span></div>
                <span class="sp"></span>
                <button class="btn primary" data-act="wiz-apply">${kind === "xp" ? "Promover a ativa" : kind === "custody" ? "Aplicar snapshot" : "Aplicar 3 linhas válidas"}</button>
              </div>`}
        </div>
      </section>
      ${destinationsPanel(kind)}
    </div>`;
  };
  return `<div class="wiz">
    <div class="wiz-top">
      <div class="wiz-brand">Carteira Ideal <span>· Importar</span></div>
      <div class="wiz-dest">${dest}</div>
      <span class="sp"></span>
      <span class="hint" style="font-size:11px;color:var(--ink-3)">Ctrl K desligado neste modo</span>
      <button class="wiz-close" data-act="wiz-close" aria-label="Sair">✕</button>
    </div>
    <div class="steps-rail">
      ${labels.map((l, i) => `<div class="step ${i + 1 === step ? "active" : i + 1 < step ? "done" : ""}"><span class="n">${i + 1 < step ? "✓" : i + 1}</span>${l}</div>${i < 3 ? '<span class="step-rule"></span>' : ""}`).join("")}
    </div>
    <div class="wiz-body">${stepBody()}</div>
    <div class="wiz-foot">
      ${step > 1 ? `<button class="btn ghost" data-act="wiz-back">← Voltar</button>` : ""}
      <span class="sp"></span>
      <span class="note">${step < 4 ? "Sair a qualquer momento guarda a sessão na caixa de entrada." : "Aplicar é a decisão; o registro guarda hash e original."}</span>
      ${step < 4 ? `<button class="btn primary" data-act="wiz-next">Continuar →</button>` : ""}
    </div>
  </div>`;
}

function pageFor(parts) {
  const root = parts[0] || "imports";
  if (root === "portfolio") {
    return { crumb: "<b>Carteira</b>", body: pagePortfolio() };
  }
  if (root === "strategies") {
    const sub = parts[1] || "list";
    const label = sub === "list" ? "" : " · " + (STRATEGY_TABS.find((t) => t.key === sub)?.label || "Edições") + (parts[2] === "review" ? " · revisão" : "");
    return { crumb: `<b>Estratégias</b>${label}`, body: pageStrategies(parts) };
  }
  if (root === "assets") {
    const sub = parts[1] || "positions";
    const label = " · " + (ASSET_TABS.find((t) => t.key === sub)?.label || "Posições") + (parts[2] === "review" ? " · revisão" : "");
    return { crumb: `<b>Ativos</b>${label}`, body: pageAssets(parts) };
  }
  if (root === "imports") {
    const sub = parts[1] || "inbox";
    const detail = ["101", "102", "xp"].includes(sub);
    const label = detail ? " · detalhe" : " · " + (IMPORT_TABS.find((t) => t.key === sub)?.label || "Caixa de entrada");
    return { crumb: `<b>Importações</b>${label}`, body: pageImports(parts) };
  }
  if (root === "plan") {
    return { crumb: "<b>Plano / Mês</b>", body: stubPage("Plano / Mês", 352, "Aberto como passos; o plano é ferramenta, não a espinha.") };
  }
  if (root === "analysis") {
    return { crumb: "<b>Análise</b>", body: stubPage("Análise", 353, "Performance, Proventos e Impostos sobre uma rail de período compartilhada.") };
  }
  return { crumb: "<b>Importações</b>", body: pageImports(["imports", "inbox"]) };
}

/* ============================ events ============================ */

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function openUpload(kind, contextual) {
  ui.drawer = false;
  if (state.v === "c") { ui.parked = null; go(`import/wizard/${kind}/1`); return; }
  ui.upload = { kind, contextual };
  render();
}

function submitUpload() {
  if (!ui.upload) return;
  const kind = ui.upload.kind;
  ui.upload = null;
  if (state.v === "a") go(kind === "xp" ? "imports/xp" : kind === "custody" ? "imports/102" : "imports/101");
  else go(kind === "xp" ? "strategies/edicoes/review" : kind === "custody" ? "assets/positions/review/102" : "assets/positions/review/101");
  toast("Arquivo lido · revisão aberta · nada aplicado ainda");
  render();
}

function scenario(key) {
  ui.upload = null;
  ui.drawer = false;
  if (key === "xp") {
    if (state.v === "c") go("import/wizard/xp/1");
    else if (state.v === "b") go("strategies/edicoes/review");
    else { go("strategies/edicoes"); openUpload("xp", true); }
  } else if (key === "b3") {
    if (state.v === "c") go("import/wizard/b3/1");
    else if (state.v === "b") go("assets/positions/review/101");
    else { go("assets/positions"); openUpload("b3", true); }
  } else if (key === "inbox") {
    go("imports/inbox");
  } else if (key === "error") {
    if (state.v === "c") go("import/wizard/b3/3");
    else if (state.v === "b") go("assets/positions/review/101");
    else go("imports/101");
  } else if (key === "fail") {
    go("imports/sources");
  }
  window.scrollTo(0, 0);
  render();
}

document.addEventListener("click", (e) => {
  const treatment = e.target.closest("[data-treatment]");
  if (treatment) { ui.upload = null; setQuery("v", treatment.dataset.treatment); return; }

  const scen = e.target.closest("[data-scenario]");
  if (scen) { scenario(scen.dataset.scenario); return; }

  const attn = e.target.closest("[data-attn]");
  if (attn) {
    const route = attn.dataset.attn;
    if (route.startsWith("imports")) go("imports/" + route.split("/")[1]);
    else if (route.startsWith("strategies")) go("strategies/edicoes");
    else if (route.startsWith("assets")) go("assets/" + (route.includes("gaps") ? "gaps" : "positions"));
    else if (route.startsWith("plan")) go("plan/month");
    else go("analysis/performance");
    toast(`Destino real: ${route} — o desenho desta tela é de outro ticket do mapa.`);
    return;
  }

  const wizKind = e.target.closest("[data-wiz-kind]");
  if (wizKind) { go(`import/wizard/${wizKind.dataset.wizKind}/1`); return; }

  const goEl = e.target.closest("[data-go]");
  if (goEl) { go(goEl.dataset.go); return; }

  const act = e.target.closest("[data-act]");
  if (!act) {
    if (e.target.classList.contains("modal-back")) { ui.upload = null; render(); }
    return;
  }
  const a = act.dataset.act;
  if (a === "noop") { toast("Simulação de protótipo: esta ação não está ligada a um parser real."); return; }
  if (a === "upload-xp") { openUpload("xp", true); return; }
  if (a === "upload-b3") { openUpload("b3", true); return; }
  if (a === "upload-custody") { openUpload("custody", true); return; }
  if (a === "upload-global") { openUpload("xp", false); return; }
  if (a === "retry-xp") { openUpload("xp", true); return; }
  if (a === "upload-kind") { if (ui.upload) { ui.upload.kind = act.dataset.kind; render(); } return; }
  if (a === "upload-context-off") { if (ui.upload) { ui.upload.contextual = false; render(); } return; }
  if (a === "upload-submit") { submitUpload(); return; }
  if (a === "upload-cancel" || a === "upload-cancel-bg") { ui.upload = null; render(); return; }
  if (a === "apply-b3") { rt.b3 = "partial"; toast("3 linhas aplicadas · 1 linha no lote de reenvio"); render(); return; }
  if (a === "discard-b3") { rt.b3 = null; toast("Importação mantida em revisão"); render(); return; }
  if (a === "reject-row") { ui.rejected504 = true; toast("Linha 504 rejeitada · fica no lote de reenvio"); render(); return; }
  if (a === "apply-custody") { rt.custody = "applied"; toast("Snapshot aplicado · 1 lacuna aberta"); render(); return; }
  if (a === "discard-custody") { rt.custody = null; toast("Snapshot mantido em revisão"); render(); return; }
  if (a === "promote-edition") { rt.edition = "promoted"; toast("Edição 104 promovida a ativa"); render(); return; }
  if (a === "discard-edition") { rt.edition = "discarded"; toast("Edição 104 descartada"); render(); return; }
  if (a === "refresh-sources") { toast("Fontes verificadas · nada novo"); return; }
  if (a === "wiz-next") {
    const p = state.parts;
    const next = Math.min(4, Number(p[3] || 1) + 1);
    go(`import/wizard/${p[2]}/${next}`);
    return;
  }
  if (a === "wiz-back") {
    const p = state.parts;
    const prev = Math.max(1, Number(p[3] || 1) - 1);
    go(`import/wizard/${p[2]}/${prev}`);
    return;
  }
  if (a === "wiz-close") {
    const p = state.parts;
    ui.parked = { kind: p[2] || "b3", step: Number(p[3] || 1) };
    go("imports/inbox");
    toast("Sessão guardada na caixa de entrada · nada aplicado");
    return;
  }
  if (a === "wiz-apply") {
    const kind = state.parts[2] || "b3";
    if (kind === "xp") rt.edition = "promoted";
    else if (kind === "custody") rt.custody = "applied";
    else rt.b3 = "partial";
    toast(kind === "xp" ? "Edição 104 promovida a ativa" : kind === "custody" ? "Snapshot aplicado · 1 lacuna aberta" : "3 linhas aplicadas · 1 no lote de reenvio");
    render();
    return;
  }
  if (a === "wiz-finish") {
    ui.parked = null;
    go("imports/inbox");
    toast("Importação concluída");
    return;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (ui.upload) { ui.upload = null; render(); }
    else if (ui.drawer) { ui.drawer = false; render(); }
  }
});

/* ============================ bottom bar / drawer / render ============================ */

function pbar() {
  return `
    <div class="title"><b>Protótipo de importações</b>ticket #354 · dados fictícios</div>
    <div class="sep"></div>
    ${Object.entries(VARIANTS).map(([k, v]) => `<button class="v ${k === state.v ? "active" : ""}" data-treatment="${k}">${v.name.split(" · ")[0]} · ${v.short}<small>${k === state.v ? "tratamento atual" : "ver tratamento"}</small></button>`).join("")}
    <div class="sep"></div>
    <div class="scen">
      <span class="lbl">Cenários</span>
      <button class="pv" data-scenario="xp">Relatório XP</button>
      <button class="pv" data-scenario="b3">Extrato B3</button>
      <button class="pv" data-scenario="inbox">Caixa de entrada</button>
      <button class="pv" data-scenario="error">Erro de linha</button>
      <button class="pv" data-scenario="fail">Fonte com falha</button>
    </div>
    <div class="sp"></div>
    <button class="ghost" data-act="drawer">O que estou vendo?</button>`;
}

function drawerHTML() {
  const v = VARIANTS[state.v];
  return `<button class="close" data-act="drawer-close">✕</button>
    <div class="k">Pergunta do ticket #354</div>
    <h3>Upload contextual × global</h3>
    <p>Como relatórios e extratos entram, onde são revisados, como erros de linha e alertas aparecem, e como se volta da caixa de entrada ao objeto que a importação muda.</p>
    <div class="k">${v.name}</div>
    <p>${v.thesis}</p>
    <div class="k">O que julgar</div>
    <ul>${v.judge.map((x) => `<li>${x}</li>`).join("")}</ul>
    <div class="k">Como dirigir</div>
    <p style="margin-bottom:8px">Use os cenários da barra inferior: <b>Relatório XP</b> abre o fluxo da estratégia, <b>Extrato B3</b> o fluxo dos dados, <b>Erro de linha</b> a linha 504, <b>Fonte com falha</b> o estado por fonte. Trocar de tratamento mantém a rota.</p>
    <div class="k">Fora deste protótipo</div>
    <ul>
      <li>Parers reais: o arquivo é simulado; nada é lido de verdade.</li>
      <li>Containers por linha no backend: hoje o erro é do arquivo, não da linha — é o read model que o fluxo pede.</li>
      <li>Leitura por fonte (status ladder) e vínculo importação → destino como campos persistidos.</li>
      <li>Direção visual (#355) e implementação no SPA (fora do escopo do mapa).</li>
    </ul>`;
}

function protoTop() {
  return `<div class="proto-banner"><b>Protótipo descartável</b><span>ticket #354 · upload e revisão de relatórios e extratos</span><span class="sp"></span><span class="tag">dados fictícios · fixture #356</span><span class="tag">visual neutro · decisão no #355</span></div>`;
}

function render() {
  const app = document.getElementById("app");
  const wizardRoute = state.parts[0] === "import" && state.parts[1] === "wizard";
  if (wizardRoute) {
    const kind = WIZ_LABELS[state.parts[2]] ? state.parts[2] : "b3";
    app.innerHTML = protoTop() + wizardHTML(kind, state.parts[3]);
  } else {
    const page = pageFor(state.parts);
    app.innerHTML = `${protoTop()}<div class="shell">${sidebar()}<div class="main">${topbar(page.crumb)}<div class="content">${banner()}${page.body}</div></div></div>${ui.upload ? uploadSheetHTML() : ""}`;
  }
  document.getElementById("pbar").innerHTML = pbar();
  document.getElementById("drawer").innerHTML = drawerHTML();
  document.getElementById("drawer").className = "drawer" + (ui.drawer ? " open" : "");
  if (ui.drawer) document.getElementById("drawer").style.display = "block";
}
document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act='drawer'], [data-act='drawer-close']");
  if (act) { ui.drawer = !ui.drawer; render(); }
});

render();
</script>
</body>
</html>
