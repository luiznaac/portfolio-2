<!DOCTYPE html>
<!--
  THROWAWAY PROTOTYPE — wayfinder ticket #350, map #347.
  Question: what shell, navigation and landing screen should the object-first IA have?
  Three shell variants, switchable in the bottom bar and in the URL (?v=a|b|c).
  Data: ../redesign/fixture.js (ticket #356). No build step, no persistence.
  Visual direction is NOT decided here — that is ticket #355.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protótipo de shell — Carteira Ideal (ticket #350)</title>
<style>
  :root {
    --bg: #f3f5f7;
    --panel: #ffffff;
    --panel-2: #f8fafb;
    --ink: #14181d;
    --ink-2: #5a6572;
    --ink-3: #8b95a1;
    --line: #dfe4e9;
    --line-2: #edf0f3;
    --accent: #1d4ed8;
    --accent-bg: #e8eefc;
    --deficit: #1d4ed8;
    --surplus: #a16207;
    --gain: #15803d;
    --loss: #b91c1c;
    --warn: #b45309;
    --warn-bg: #fdf3e3;
    --action-bg: #fdeaea;
    --action: #b91c1c;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;

    --bar: 54px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--bar) + 26px);
  }
  a { color: var(--accent); text-decoration: none; }
  button { font: inherit; color: inherit; }
  .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { text-align: right; white-space: nowrap; }
  .dim { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .gain { color: var(--gain); }
  .loss { color: var(--loss); }
  .def { color: var(--deficit); }
  .sur { color: var(--surplus); }

  .proto-banner {
    background: #101826; color: #c7d2e3; font-size: 11px; letter-spacing: .01em;
    padding: 5px 16px; display: flex; gap: 14px; align-items: center; position: relative; z-index: 40;
  }
  .proto-banner b { color: #fff; font-weight: 600; }
  .proto-banner .sp { flex: 1; }
  .proto-banner .tag { border: 1px solid #33415a; padding: 0 6px; border-radius: 3px; color: #93a4bd; }

  /* ---------- shell A: flat six sidebar with contextual subs ---------- */
  .shell { min-height: 100vh; }
  .shell.a, .shell.b { display: grid; grid-template-columns: 230px minmax(0, 1fr); }
  .shell.c { display: block; }

  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 27px;
    height: calc(100vh - 27px - var(--bar));
  }
  .side .brand {
    padding: 16px 16px 10px; display: flex; align-items: baseline; gap: 7px;
  }
  .side .brand b { font-size: 14px; letter-spacing: -.01em; }
  .side .brand span { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
  .side nav { padding: 6px 8px; overflow: auto; }
  .side .group-label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
    padding: 13px 8px 4px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 8px; border: 0; border-radius: 5px; background: none; cursor: pointer;
    color: var(--ink-2); text-align: left; font-size: 12.5px;
  }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 15px; height: 15px; flex: none; color: currentColor; opacity: .85; }
  .nav-item .cnt {
    margin-left: auto; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    font: 600 10px/17px var(--mono); text-align: center; background: var(--line); color: var(--ink-2);
  }
  .nav-item .cnt.action { background: var(--action); color: #fff; }
  .subnav { margin: 2px 0 6px 23px; border-left: 1px solid var(--line); padding-left: 8px; }
  .subnav button {
    display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 4px 7px; border-radius: 4px; color: var(--ink-2); font-size: 12px;
  }
  .subnav button:hover { background: var(--panel-2); color: var(--ink); }
  .subnav button.active { color: var(--accent); font-weight: 600; background: var(--panel-2); }
  .side .foot {
    margin-top: auto; border-top: 1px solid var(--line-2); padding: 11px 16px; font-size: 11px; color: var(--ink-3);
    display: grid; gap: 3px;
  }
  .side .foot b { color: var(--ink-2); font-weight: 600; }

  /* ---------- main ---------- */
  .main { min-width: 0; }
  .topbar {
    min-height: 52px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 14px; padding: 0 22px;
    position: sticky; top: 27px; z-index: 20;
  }
  .shell.a .topbar, .shell.b .topbar { top: 27px; }
  .crumb { color: var(--ink-2); font-size: 12px; }
  .crumb b { color: var(--ink); }
  .topbar .sp { flex: 1; }
  .month-pill {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    background: var(--panel-2); border-radius: 16px; padding: 4px 11px; font-size: 11.5px; color: var(--ink-2);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gain); display: inline-block; }
  .topbar .age { font-size: 11px; color: var(--ink-3); }
  .kbd {
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px;
    font: 10px/14px var(--mono); color: var(--ink-3); background: var(--panel);
  }

  .content { padding: 20px 22px 40px; max-width: 1500px; }
  .shell.b .content { max-width: 1360px; }
  .shell.c .content { max-width: 1460px; margin: 0 auto; }

  .page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  .page-head h1 { font-size: 21px; line-height: 1.15; letter-spacing: -.025em; margin: 0 0 3px; font-weight: 650; }
  .page-head p { margin: 0; color: var(--ink-2); font-size: 12px; }
  .page-head .sp { flex: 1; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 2px 0 16px; }
  .tabs button {
    border: 0; background: none; cursor: pointer; padding: 7px 11px; color: var(--ink-2);
    font-size: 12.5px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .segmented {
    display: inline-flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px; margin-bottom: 14px;
  }
  .segmented button {
    border: 0; background: none; cursor: pointer; padding: 4px 11px; border-radius: 4px;
    color: var(--ink-2); font-size: 12px;
  }
  .segmented button:hover { color: var(--ink); }
  .segmented button.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(15, 23, 34, .10); }

  .grid { display: grid; gap: 14px; }
  .grid > * { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
  .panel > header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-2);
  }
  .panel > header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin: 0; color: var(--ink-2); font-weight: 650; }
  .panel > header .sp { flex: 1; }
  .panel > header .hint { font-size: 11px; color: var(--ink-3); }
  .panel .body { padding: 13px 14px; }
  .panel .body.flush { padding: 0; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
  .kpi .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
  .kpi .v { font: 600 19px/1.25 var(--mono); margin-top: 3px; letter-spacing: -.03em; }
  .kpi .s { font-size: 11px; color: var(--ink-2); margin-top: 1px; }
  .kpi .s b { font-weight: 600; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.t th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-3); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--line-2);
    background: var(--panel-2);
  }
  table.t td { padding: 7px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t th.r, table.t td.r { text-align: right; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: var(--panel-2); }
  .ticker { font: 600 12px/1 var(--mono); letter-spacing: -.01em; }
  .chip {
    display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 9.5px; font-weight: 650;
    letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-2);
    background: var(--panel-2); line-height: 15px; white-space: nowrap;
  }
  .chip.blue { color: var(--accent); background: var(--accent-bg); border-color: #cfdcfb; }
  .chip.amber { color: var(--warn); background: var(--warn-bg); border-color: #f3e0bd; }
  .chip.red { color: var(--action); background: var(--action-bg); border-color: #f5cfcf; }
  .chip.green { color: var(--gain); background: #e9f6ee; border-color: #cce9d7; }
  .chip.grey { color: var(--ink-3); }
  .chip.plain { background: none; }

  .bar { height: 5px; border-radius: 3px; background: var(--line-2); position: relative; overflow: visible; min-width: 80px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); display: block; }
  .bar u {
    position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55;
    text-decoration: none; transform: translateX(-1px);
  }
  .alloc-row td { padding-top: 9px; padding-bottom: 9px; }
  .alloc-sub { font-size: 11px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
  .alloc-sub b { font-weight: 600; color: var(--ink-2); }
  .class-bar { display: flex; align-items: center; gap: 8px; }
  .class-bar .bar { flex: 1; max-width: 150px; }

  .attn { display: grid; }
  .attn-item {
    display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 9px;
    padding: 9px 12px; border-bottom: 1px solid var(--line-2); align-items: start;
    background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer;
    width: 100%;
  }
  .attn-item:hover { background: var(--panel-2); }
  .attn-item:last-child { border-bottom: 0; }
  .attn-item .mark { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; background: var(--ink-3); }
  .attn-item .mark.action { background: var(--action); }
  .attn-item .mark.watch { background: var(--surplus); }
  .attn-item .ttl { display: block; font-size: 12px; font-weight: 550; }
  .attn-item .det { display: block; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .attn-item .go { font-size: 11px; color: var(--accent); margin-top: 1px; white-space: nowrap; }
  .attn-head { display: flex; align-items: center; gap: 8px; }
  .attn-counts { display: flex; gap: 6px; }
  .attn-split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: start; }
  .attn-group { min-width: 0; }
  .attn-split .attn-group + .attn-group { border-left: 1px solid var(--line-2); }

  .plan-eq { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 12px var(--mono); }
  .plan-eq .k { color: var(--ink-3); font: 11px var(--sans); }
  .plan-eq .op { color: var(--ink-3); }
  .plan-eq .box { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 2px 7px; }

  .mini-list { display: grid; gap: 0; }
  .mini-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-2); font-size: 12px; flex-wrap: wrap; }
  .mini-row:last-child { border-bottom: 0; }
  .mini-row .sp { flex: 1; }

  .spark { display: flex; align-items: flex-end; gap: 3px; height: 42px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .75; }
  .spark i.neg { background: var(--loss); }

  .shortcut { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
  .shortcut:last-child { border-bottom: 0; }
  .shortcut .sp { flex: 1; }

  .callout {
    border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11px;
    color: var(--ink-3); background: var(--panel-2);
  }
  .callout b { color: var(--ink-2); font-weight: 600; }

  .banner-tests {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
    font-size: 11.5px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 5px; padding: 7px 11px;
  }
  .banner-tests b { color: var(--ink); }
  .banner-tests .q { color: var(--ink-3); }

  /* ---------- shell C top object rail ---------- */
  .shell.c .toprail {
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 27px; z-index: 25;
  }
  .shell.c .toprail .inner { max-width: 1460px; margin: 0 auto; padding: 0 22px; display: flex; align-items: center; gap: 18px; min-height: 52px; }
  .shell.c .toprail .brand { font-weight: 650; font-size: 14px; letter-spacing: -.02em; white-space: nowrap; }
  .shell.c .toprail .brand span { font-weight: 400; color: var(--ink-3); font-size: 10px; margin-left: 6px; text-transform: uppercase; letter-spacing: .08em; }
  .objrail { display: flex; gap: 2px; flex: 1; overflow: auto; }
  .objrail button {
    border: 0; background: none; cursor: pointer; padding: 7px 11px; border-radius: 5px;
    color: var(--ink-2); font-size: 12.5px; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .objrail button:hover { background: var(--panel-2); color: var(--ink); }
  .objrail button.active { background: var(--ink); color: #fff; font-weight: 600; }
  .objrail button .cnt { background: var(--action); color: #fff; border-radius: 8px; font: 600 9.5px/15px var(--mono); padding: 0 4px; }
  .objrail button.active .cnt { background: #fff; color: var(--action); }

  .c-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .95fr) minmax(320px, .9fr); gap: 14px; align-items: start; }
  .c-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }

  /* ---------- bottom prototype bar ---------- */
  .pbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: #0f1722; color: #dbe3ee; border-top: 1px solid #263242;
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: var(--bar);
    box-shadow: 0 -6px 24px rgba(9, 15, 25, .18);
  }
  .pbar .title { font-size: 11px; color: #8fa0b8; line-height: 1.25; max-width: 190px; }
  .pbar .title b { color: #fff; display: block; font-size: 11.5px; }
  .pbar .sep { width: 1px; align-self: stretch; background: #263242; margin: 2px 6px; }
  .pbar button.v {
    border: 1px solid #33415a; background: #172437; color: #c8d4e5; border-radius: 5px;
    padding: 5px 9px; cursor: pointer; font-size: 11.5px; text-align: left; line-height: 1.2;
  }
  .pbar button.v small { display: block; color: #8092aa; font-size: 9.5px; margin-top: 1px; }
  .pbar button.v:hover { border-color: #4b5d7a; }
  .pbar button.v.active { background: #e8eefc; border-color: #e8eefc; color: #14306b; }
  .pbar button.v.active small { color: #3d5a8f; }
  .pbar .sp { flex: 1; }
  .pbar .subctl { display: flex; align-items: center; gap: 4px; }
  .pbar .subctl .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: #8092aa; margin-right: 3px; white-space: nowrap; }
  .pbar button.pv {
    border: 1px solid #33415a; background: #172437; color: #c8d4e5; border-radius: 4px;
    padding: 4px 7px; cursor: pointer; font-size: 11px; white-space: nowrap;
  }
  .pbar button.pv:hover { border-color: #4b5d7a; }
  .pbar button.pv.active { background: #e8eefc; color: #14306b; border-color: #e8eefc; font-weight: 600; }
  .pbar .note { font-size: 10.5px; color: #8092aa; max-width: 340px; text-align: right; }
  .pbar .note b { color: #c8d4e5; font-weight: 600; }
  .pbar .ghost {
    border: 1px solid #33415a; background: none; color: #c8d4e5; border-radius: 5px;
    padding: 5px 8px; cursor: pointer; font-size: 11px;
  }

  .drawer {
    position: fixed; right: 12px; bottom: calc(var(--bar) + 10px); z-index: 70; width: 430px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(15, 23, 34, .22);
    padding: 14px 16px; font-size: 12px; display: none;
  }
  .drawer.open { display: block; }
  .drawer h3 { margin: 0 0 6px; font-size: 13px; }
  .drawer p { margin: 0 0 8px; color: var(--ink-2); }
  .drawer ul { margin: 0 0 8px; padding-left: 16px; color: var(--ink-2); }
  .drawer li { margin-bottom: 3px; }
  .drawer .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 650; margin-bottom: 3px; }
  .drawer .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; cursor: pointer; color: var(--ink-3); }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--bar) + 16px); transform: translateX(-50%) translateY(10px);
    background: #111a27; color: #e6edf7; font-size: 11.5px; padding: 7px 12px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: .18s ease; z-index: 80; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1320px) {
    .c-grid { grid-template-columns: minmax(0, 1fr) minmax(300px, .9fr); }
    .c-grid > .c-col:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 980px) {
    .shell.a, .shell.b { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .landing-a { grid-template-columns: 1fr !important; }
    .c-grid { grid-template-columns: 1fr; }
    .c-grid > .c-col:last-child { grid-template-columns: 1fr; }
    .attn-split { grid-template-columns: 1fr; }
    .pbar .note, .pbar .title { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer"></div>
<div class="pbar" id="pbar"></div>

<script type="module">
import F from "./fixture.js";

/* ============================ helpers ============================ */

const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const brl0 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const money = (n) => brl.format(n);
const money0 = (n) => brl0.format(n);
const short = (n) => n >= 1e6 ? `R$ ${(n / 1e6).toFixed(2).replace(".", ",")} mi` : n >= 1e3 ? `R$ ${(n / 1e3).toFixed(1).replace(".", ",")} mil` : money(n);
const pct = (n, digits = 2) => `${n.toFixed(digits).replace(".", ",")}%`;
const pp = (n) => `${n > 0 ? "+" : ""}${n.toFixed(2).replace(".", ",")} pp`;
const classLabel = { ACOES: "Ações", FIIS: "FIIs", RENDA_FIXA: "Renda fixa" };
const classChip = { ACOES: "blue", FIIS: "amber", RENDA_FIXA: "green" };
const monthLabel = (period) => {
  const [y, m] = period.split("-");
  return `${["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][Number(m) - 1]}/${y.slice(2)}`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============================ IA model ============================ */

const OBJECTS = [
  {
    key: "portfolio", label: "Carteira", group: "Posição",
    icon: '<svg class="ico" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6h12M5 10h3" stroke="currentColor" stroke-width="1.3"/></svg>',

/* Route mapping: an attention item points at the object + sub-view that owns it. */
function routeTarget(route) {
  const [root, second] = route.split("/");
  if (root === "imports") return { obj: "imports", sub: second === "corporate-actions" ? "corporate" : "inbox" };
  if (root === "strategies") return { obj: "strategies", sub: route.includes("/editions/") ? "editions" : "list" };
  if (root === "plan") return { obj: "plan", sub: second === "transfers" ? "transfers" : "month" };
  if (root === "assets") return { obj: "assets", sub: second === "gaps" ? "gaps" : "quotes" };
  if (root === "analysis") return { obj: "analysis", sub: second === "income" ? "income" : "tax" };
  return { obj: "portfolio", sub: "overview" };
}

function parseURL() {
  const q = new URLSearchParams(location.search);
  const variant = ["a", "b", "c"].includes(q.get("v")) ? q.get("v") : "b";
  const placement = ["tabs", "sidebar", "segment"].includes(q.get("p"))
    ? q.get("p")
    : variant === "a" ? "sidebar" : "tabs";
  const parts = (location.hash.replace(/^#\/?/, "") || "portfolio/overview").split("/");
  const obj = objByKey[parts[0]] ? parts[0] : "portfolio";
  const sub = (objByKey[obj].subs.find((s) => s.key === parts[1]) || objByKey[obj].subs[0]).key;
  return { variant, placement, obj, sub };
}
let state = parseURL();

function navigate(obj, sub) {
  const target = sub || objByKey[obj].subs[0].key;
  location.hash = `#/${obj}/${target}`;
}
function setQueryParam(key, value) {
  const q = new URLSearchParams(location.search);
  q.set(key, value);
  location.search = q.toString();
}
function setVariant(v) {
  const q = new URLSearchParams(location.search);
  const wasDefault = !q.has("p");
  q.set("v", v);
  if (wasDefault) q.delete("p");
  location.search = q.toString();
}

  const fromAllocation = F.portfolio.allocation.classes.flatMap((c) => (c.strategies || []).map((s) => ({ ...s, cls: c.asset_class }))).find((s) => s.strategy === name);

  const manual = F.strategies.holdings.find((h) => h.strategy_name === name);
  const row = F.strategies.rows.find((r) => r.name === name);
  return { actual: manual?.total_value ?? 0, drift: null, cls: row?.asset_class };
}

  return `<div class="toprail"><div class="inner">
    <div class="brand">Carteira Ideal<span>console</span></div>
    <div class="objrail">${OBJECTS.map((o) => `<button class="${o.key === state.obj ? "active" : ""}" data-go="${o.key}/${o.subs[0].key}">${o.label}${o.badge() ? `<span class="cnt">${o.badge()}</span>` : ""}</button>`).join("")}</div>
    <span class="month-pill"><span class="dot"></span> Nov 2026</span>
  </div></div>`;
}

function contentForVariant() {
  if (state.obj === "portfolio" && state.sub === "overview") {
    const landing = state.variant === "a" ? landingA() : state.variant === "b" ? landingB() : landingC();
    return banner() + landing;
  }
  const o = objByKey[state.obj];
  const body = (PAGES[state.obj] || pagePortfolio)();
  if (state.placement === "sidebar") return body;
  const control = state.placement === "segment" ? segmentedHTML(o) : tabsHTML(o);
  return body.replace("<!--HEAD-->", "<!--HEAD-->" + control);
}

function banner() {
  const v = VARIANTS[state.variant];
  const tests = {
    a: "Sidebar plano: os seis objetos sozinhos e os sub-itens só no objeto ativo. Landing com a atenção na coluna à direita.",
    b: "Escolhida: sidebar em três grupos, carteira + atenção acima da dobra e sub-views em abas. A e C ficam para comparação; use os botões Sub-views na barra de baixo para rever os outros placements numa página de objeto.",
    c: "Sem sidebar permanente: trilho superior e cockpit de três colunas. A atenção é uma coluna central.",
  };
  return `<div class="banner-tests"><b>${v.name}</b><span class="q">${tests[state.variant]}</span></div>`;
}

function pbar() {
  const isLanding = state.obj === "portfolio" && state.sub === "overview";
  const subctl = isLanding ? "" : `
    <div class="sep"></div>
    <div class="subctl">
      <span class="lbl">Sub-views</span>
      ${Object.entries(PLACEMENTS).map(([k, v]) => `<button class="pv ${k === state.placement ? "active" : ""}" data-placement="${k}">${v.label}</button>`).join("")}
    </div>`;
  return `
    <div class="title"><b>Protótipo de shell</b>ticket #350 · dados fictícios</div>
    <div class="sep"></div>
    ${Object.entries(VARIANTS).map(([k, v]) => `<button class="v ${k === state.variant ? "active" : ""}" data-variant="${k}">${v.name.split(" · ")[0]} · ${v.short}<small>${v === VARIANTS[state.variant] ? "variante atual" : "ver variante"}</small></button>`).join("")}
    ${subctl}
    <div class="sp"></div>
    <div class="note">Visual neutro: <b>a direção visual é o #355</b>.</div>
    <button class="ghost" data-drawer="1">O que estou vendo?</button>`;
}

function drawer() {
  const v = VARIANTS[state.variant];
  const q = {
    a: ["Os seis objetos sozinhos bastam, ou falta um agrupamento?", "O subnav no sidebar aguenta objetos com quatro sub-itens?", "A atenção na coluna à direita é encontrada sem competir com a alocação?"],
    b: ["Os grupos Posição / Operações / Resultados são os nomes certos?", "Com a mesma landing, o agrupamento paga o custo de mais chrome?", "Qual placement de sub-views funciona melhor: abas, sidebar ou segmentado?"],
    c: ["Sem sidebar, o trilho superior escala para seis objetos?", "O cockpit de três colunas é melhor que a página que rola?", "A atenção no centro merece o espaço mais nobre da tela?"],
  }[state.variant];
  const placement = PLACEMENTS[state.placement];
  return `
    <button class="close" data-drawer="0">✕</button>
    <div class="k">Variante ${state.variant.toUpperCase()}</div>
    <h3>${v.name}</h3>
    <p>${v.thesis}</p>
    <div class="k">O que julgar</div>
    <ul>${q.map((x) => `<li>${x}</li>`).join("")}</ul>
    <div class="k">Placement atual: ${placement.long}</div>
    <p style="margin-bottom:0">${state.placement === "tabs" ? "As sub-views ficam em abas logo abaixo do título da página; o sidebar nunca cresce." : state.placement === "sidebar" ? "As sub-views abrem sob o objeto ativo no sidebar; a página não repete a navegação." : "As sub-views viram um controle segmentado no topo do corpo da página, entre o título e o conteúdo."} Troque na barra de baixo quando estiver numa página de objeto.</p>
    <div class="k" style="margin-top:8px">Fora deste protótipo</div>
    <p style="margin-bottom:0">Direção visual (#355), o desenho de cada tela (#351–#354) e a implementação no SPA (fora do escopo do mapa).</p>`;
}

/* ============================ render / events ============================ */

function render() {
  const app = document.getElementById("app");
  const chrome = state.variant === "c"
    ? `<div class="shell c">${toprail()}<div class="content">${contentForVariant()}</div></div>`
    : `<div class="shell ${state.variant}">${sidebar()}<div class="main">${topbar()}<div class="content">${contentForVariant()}</div></div></div>`;
  app.innerHTML = `<div class="proto-banner"><b>Protótipo descartável</b><span>ticket #350 · shell, navegação e landing</span><span class="sp"></span><span class="tag">dados fictícios · fixture #356</span><span class="tag">visual neutro · decisão no #355</span></div>${chrome}`;
  document.getElementById("pbar").innerHTML = pbar();
  document.getElementById("drawer").innerHTML = drawer();
  document.getElementById("drawer").className = "drawer" + (drawerOpen ? " open" : "");
  window.scrollTo(0, 0);
}

let drawerOpen = false;
let toastTimer;

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

document.addEventListener("click", (e) => {
  const variant = e.target.closest("[data-variant]");
  if (variant) { setVariant(variant.dataset.variant); return; }

  const placement = e.target.closest("[data-placement]");
  if (placement) { setQueryParam("p", placement.dataset.placement); return; }

  const drawerBtn = e.target.closest("[data-drawer]");
  if (drawerBtn) { drawerOpen = drawerBtn.dataset.drawer === "1"; render(); return; }

  const go = e.target.closest("[data-go]");
  if (go) { navigate(...go.dataset.go.split("/")); return; }

  const route = e.target.closest("[data-route]");
  if (route) {
    const t = routeTarget(route.dataset.route);
    navigate(t.obj, t.sub);
    toast(`Destino real: ${route.dataset.route} — o desenho desta tela é o ticket #${ownerTicket[t.obj]}.`);
    return;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerOpen) { drawerOpen = false; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    toast("Busca global / paleta de comandos: ainda não especificada no mapa (#347, Not yet specified).");
  }
});

// Correct a landing detail that depends on the snapshot shape.
render();
</script>
</body>
</html>
