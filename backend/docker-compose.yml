# The schema is NOT seeded here: db/migration/V*.sql is applied by Flyway
# (./gradlew :persistence:migrate locally, deploy/entrypoint.sh in the container).

services:
  mysql:
    image: mysql:26.7.0
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=portfolio
    ports:
      - "3306:3306"
    volumes:
      - portfolio-mysql-data:/var/lib/mysql

volumes:
  # Named explicitly so it never collides with another project's data volume — Compose's
  # default project name is just the directory basename ("backend"), which isn't unique across
  # repos on the same machine.
  portfolio-mysql-data:
