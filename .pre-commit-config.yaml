repos:
  - repo: local
    hooks:
      - id: detekt
        name: detekt
        entry: sh -c 'cd backend && ./gradlew detekt'
        language: system
        files: ^backend/.*\.kt$
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: sh -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
