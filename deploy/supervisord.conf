; Program definitions, included by /etc/supervisor/supervisord.conf.
; Both processes log to the container's stdout/stderr.

[program:api]
command=/opt/app/application-1.0/bin/application
directory=/opt/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
; The OTel SDK flushes on SIGTERM with a 10 s deadline; supervisord's default 10 s stop
; deadline can SIGKILL the JVM before that flush completes.
stopwaitsecs=20
stopasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
